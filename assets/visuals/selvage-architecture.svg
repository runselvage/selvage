<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 790" width="1600" height="790" role="img" aria-labelledby="t d" font-family="'IBM Plex Mono','SFMono-Regular',ui-monospace,Menlo,monospace"><title id="t">Selvage architecture: from request to reviewed branch</title><desc id="d">A local control plane drives external coding CLIs. Surfaces — web dashboard, CLI and MCP — submit work to a project-scoped scheduler that owns leases, routing, budgets, the evidence ledger and per-attempt verification plans. The loop runs left to right: a structural code index orients the implementer, which works in an isolated Git worktree and commits; the scheduler verifies that commit against a plan pinned for the attempt with a fresh database; an independent model on a different provider reviews the diff and evidence with no write tools. Outcomes fan out three ways: approve reaches the human approval gate and then a local merge or a pull request, revise becomes one micro-task per finding executed in order and finalized deterministically before re-verification, and separable findings are deferred to a tracked follow-up. Nothing publishes without human approval.</desc><defs><marker id="ac" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#2a7f8f"/></marker><marker id="ao" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#c4552a"/></marker><marker id="ab" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#2f4e7e"/></marker><marker id="ag" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#5b7d5b"/></marker><marker id="am" markerWidth="9" markerHeight="9" refX="7.5" refY="3.5" orient="auto"><path d="M0,0 L0,7 L8,3.5 z" fill="#8a8578"/></marker></defs><rect width="1600" height="790" fill="#f3f0ea"/><text x="60" y="50" font-size="13" letter-spacing="3.2" fill="#8a8578">ARCHITECTURE</text><text x="60" y="90" font-size="33" font-weight="600" fill="#1c2530">Selvage — from request to reviewed branch</text><line x1="1010" y1="42" x2="1036" y2="42" stroke="#2a7f8f" stroke-width="3"/><text x="1044" y="46" font-size="12.5" fill="#5c6672">retrieval</text><line x1="1137" y1="42" x2="1163" y2="42" stroke="#c4552a" stroke-width="3"/><text x="1171" y="46" font-size="12.5" fill="#5c6672">implementation</text><line x1="1302" y1="42" x2="1328" y2="42" stroke="#2f4e7e" stroke-width="3"/><text x="1336" y="46" font-size="12.5" fill="#5c6672">review</text><line x1="1407" y1="42" x2="1433" y2="42" stroke="#5b7d5b" stroke-width="3"/><text x="1441" y="46" font-size="12.5" fill="#5c6672">approval</text><text x="60" y="128" font-size="11.5" fill="#8a8578">EXTERNAL CODING CLIs — YOUR SUBSCRIPTIONS, YOUR AUTH</text><rect x="60" y="142" width="215" height="48" rx="6" fill="none" stroke="#c9c3b6" stroke-dasharray="4 4"/><text x="168" y="163" font-size="13" fill="#3d4653" text-anchor="middle">Claude Code</text><text x="168" y="180" font-size="10.5" fill="#8a8578" text-anchor="middle">anthropic · reports cost</text><rect x="287" y="142" width="215" height="48" rx="6" fill="none" stroke="#c9c3b6" stroke-dasharray="4 4"/><text x="395" y="163" font-size="13" fill="#3d4653" text-anchor="middle">Kiro CLI</text><text x="395" y="180" font-size="10.5" fill="#8a8578" text-anchor="middle">kiro · reports credits</text><rect x="514" y="142" width="215" height="48" rx="6" fill="none" stroke="#c9c3b6" stroke-dasharray="4 4"/><text x="622" y="163" font-size="13" fill="#3d4653" text-anchor="middle">OpenCode</text><text x="622" y="180" font-size="10.5" fill="#8a8578" text-anchor="middle">any authenticated provider</text><rect x="741" y="142" width="215" height="48" rx="6" fill="none" stroke="#c9c3b6" stroke-dasharray="4 4"/><text x="849" y="163" font-size="13" fill="#3d4653" text-anchor="middle">Codex</text><text x="849" y="180" font-size="10.5" fill="#8a8578" text-anchor="middle">openai</text><text x="972" y="163" font-size="11.5" fill="#8a8578">Selvage drives these as processes.</text><text x="972" y="180" font-size="11.5" fill="#8a8578">Context leaves under each provider's terms.</text><rect x="48" y="214" width="1352" height="488" rx="10" fill="none" stroke="#b9b3a6"/><rect x="60" y="205" width="422" height="18" fill="#f3f0ea"/><text x="66" y="219" font-size="11.5" fill="#6b7480">DEVELOPER MACHINE — LOCAL CONTROL PLANE</text><rect x="70" y="244" width="168" height="50" rx="6" fill="#fbfaf7" stroke="#1c2530" stroke-width="1.6"/><text x="84" y="265" font-size="14" fill="#1c2530" font-weight="600">Web dashboard</text><text x="84" y="283" font-size="10.5" fill="#8a8578">primary surface</text><rect x="70" y="302" width="168" height="38" rx="6" fill="#fbfaf7" stroke="#c9c3b6" stroke-width="1.0"/><text x="84" y="326" font-size="14" fill="#1c2530">CLI · slv</text><rect x="70" y="348" width="168" height="50" rx="6" fill="#fbfaf7" stroke="#c9c3b6" stroke-width="1.0"/><text x="84" y="369" font-size="14" fill="#1c2530">MCP server</text><text x="84" y="387" font-size="10.5" fill="#8a8578">agents submit + query</text><text x="70" y="424" font-size="11" fill="#8a8578">prompt · issue · spec</text><text x="70" y="440" font-size="11" fill="#8a8578">epic batch</text><path d="M238 321 L280 321" stroke="#8a8578" stroke-width="1.4" fill="none" marker-end="url(#am)"/><rect x="286" y="244" width="214" height="104" rx="8" fill="#16212b" stroke="none"/><text x="302" y="272" font-size="15.5" fill="#f7f5f0" font-weight="600">Scheduler</text><text x="302" y="292" font-size="11" fill="#9fb0bd">one per project</text><text x="302" y="316" font-size="11" fill="#9fb0bd">leases · routing · budgets</text><text x="302" y="333" font-size="11" fill="#9fb0bd">independence floor enforced</text><rect x="286" y="358" width="102" height="40" rx="5" fill="#fbfaf7" stroke="#c9c3b6" stroke-width="1.0"/><text x="296" y="374" font-size="10.5" fill="#3d4653">task queue</text><text x="296" y="388" font-size="10.5" fill="#8a8578">+ retries</text><rect x="398" y="358" width="102" height="40" rx="5" fill="#fbfaf7" stroke="#c9c3b6" stroke-width="1.0"/><text x="408" y="374" font-size="10.5" fill="#3d4653">adapter</text><text x="408" y="388" font-size="10.5" fill="#8a8578">router</text><rect x="286" y="406" width="102" height="40" rx="5" fill="#fbfaf7" stroke="#c9c3b6" stroke-width="1.0"/><text x="296" y="422" font-size="10.5" fill="#3d4653">evidence</text><text x="296" y="436" font-size="10.5" fill="#8a8578">ledger</text><rect x="398" y="406" width="102" height="40" rx="5" fill="#fbfaf7" stroke="#c9c3b6" stroke-width="1.0"/><text x="408" y="422" font-size="10.5" fill="#3d4653">usage +</text><text x="408" y="436" font-size="10.5" fill="#8a8578">provenance</text><rect x="286" y="454" width="214" height="42" rx="5" fill="#fbfaf7" stroke="#c9c3b6" stroke-width="1.0"/><text x="296" y="470" font-size="10.5" fill="#3d4653">per-attempt verification plans</text><text x="296" y="484" font-size="10.5" fill="#8a8578">pinned · immutable</text><text x="286" y="522" font-size="11" fill="#8a8578">Task state, evidence, plans,</text><text x="286" y="538" font-size="11" fill="#8a8578">sessions and usage stay here.</text><rect x="548" y="244" width="214" height="84" rx="8" fill="#eaf3f4" stroke="#2a7f8f" stroke-width="1.6"/><text x="562" y="268" font-size="14.5" fill="#1c5b68" font-weight="600">Code index</text><text x="562" y="285" font-size="10.5" fill="#3d6b74">AST + BM25 retrieval</text><text x="562" y="302" font-size="10.5" fill="#3d6b74">bounded orientation budget</text><text x="562" y="319" font-size="10.5" fill="#3d6b74">route-mirror guardrail</text><path d="M655 328 L655 366" stroke="#2a7f8f" stroke-width="1.8" fill="none" marker-end="url(#ac)"/><text x="666" y="352" font-size="10.5" fill="#2a7f8f">orients</text><rect x="548" y="374" width="214" height="70" rx="8" fill="#fbf1ec" stroke="#c4552a" stroke-width="1.6"/><text x="562" y="398" font-size="14.5" fill="#a8461f" font-weight="600">Implementer</text><text x="562" y="415" font-size="10.5" fill="#8a5a44">model + provider A</text><text x="562" y="432" font-size="10.5" fill="#8a5a44">isolated Git worktree</text><path d="M655 444 L655 476" stroke="#c4552a" stroke-width="1.8" fill="none" marker-end="url(#ao)"/><rect x="548" y="484" width="214" height="44" rx="6" fill="#fbfaf7" stroke="#e0b9a6" stroke-width="1.0"/><text x="562" y="504" font-size="12.5" fill="#1c2530">implementation commit</text><text x="562" y="520" font-size="10.5" fill="#8a8578">your checkout never touched</text><path d="M762 506 L810 506" stroke="#c4552a" stroke-width="1.8" fill="none" marker-end="url(#ao)"/><rect x="810" y="244" width="214" height="128" rx="8" fill="#16212b" stroke="none"/><text x="824" y="270" font-size="15.5" fill="#f7f5f0" font-weight="600">Verification</text><text x="824" y="289" font-size="10.5" fill="#9fb0bd">the scheduler runs it</text><text x="824" y="314" font-size="11.5" fill="#dfe6ea">build</text><text x="1010" y="314" font-size="10.5" fill="#7fd8c0" text-anchor="end">plan pinned</text><text x="824" y="334" font-size="11.5" fill="#dfe6ea">tests</text><text x="1010" y="334" font-size="10.5" fill="#7fd8c0" text-anchor="end">fresh DB</text><text x="824" y="354" font-size="11.5" fill="#dfe6ea">project checks</text><text x="1010" y="354" font-size="10.5" fill="#7fd8c0" text-anchor="end">per attempt</text><rect x="810" y="382" width="214" height="46" rx="6" fill="#fbfaf7" stroke="#c9c3b6" stroke-width="1.0"/><text x="824" y="402" font-size="12.5" fill="#1c2530">verification evidence</text><text x="824" y="418" font-size="10.5" fill="#8a8578">logs · exit codes · SHA</text><path d="M1024 404 L1072 404" stroke="#2f4e7e" stroke-width="1.8" fill="none" marker-end="url(#ab)"/><path d="M870 428 L870 452 L708 452 L708 484" stroke="#c4552a" stroke-width="1.6" fill="none" marker-end="url(#ao)"/><rect x="1072" y="244" width="214" height="118" rx="8" fill="#eef1f7" stroke="#2f4e7e" stroke-width="1.6"/><text x="1086" y="270" font-size="15.5" fill="#26406b" font-weight="600">Independent review</text><text x="1086" y="288" font-size="10.5" fill="#455a7e">model + provider B</text><text x="1086" y="306" font-size="10.5" fill="#455a7e">receives diff + evidence</text><text x="1086" y="324" font-size="10.5" fill="#455a7e">no write tools</text><text x="1086" y="348" font-size="11" fill="#26406b" font-weight="600">verdict + findings</text><text x="1072" y="384" font-size="10.5" fill="#8a8578">✗ a model reviewing its own</text><text x="1072" y="399" font-size="10.5" fill="#8a8578">  work is not independent</text><path d="M1179 420 L1179 452" stroke="#2f4e7e" stroke-width="1.8" fill="none" marker-end="url(#ab)"/><text x="1286" y="236" font-size="10.5" fill="#5b7d5b" text-anchor="end">approve →</text><path d="M1286 282 L1310 282" stroke="#5b7d5b" stroke-width="1.8" fill="none" marker-end="url(#ag)"/><rect x="1072" y="460" width="214" height="66" rx="8" fill="#fbfaf7" stroke="#c9c3b6" stroke-width="1.0"/><text x="1086" y="482" font-size="13" fill="#1c2530" font-weight="600">DEFER</text><text x="1086" y="498" font-size="10.5" fill="#8a8578">valid but separable —</text><text x="1086" y="514" font-size="10.5" fill="#8a8578">tracked as a follow-up</text><rect x="70" y="560" width="430" height="122" rx="8" fill="#fbfaf7" stroke="#c9c3b6" stroke-width="1.0"/><text x="86" y="584" font-size="13" fill="#1c2530" font-weight="600">WHAT THE RECEIPT CONTAINS</text><text x="86" y="606" font-size="11" fill="#5c6672">implementation commits, per attempt</text><text x="86" y="628" font-size="11" fill="#5c6672">build, test and check output with exit codes</text><text x="86" y="650" font-size="11" fill="#5c6672">review verdict, findings, reviewer identity</text><text x="86" y="672" font-size="11" fill="#5c6672">usage per leg — reported or marked unavailable</text><rect x="548" y="560" width="738" height="122" rx="8" fill="#fbf1ec" stroke="#c4552a" stroke-width="1.4"/><text x="564" y="584" font-size="14" fill="#a8461f" font-weight="600">REVISE — one micro-task per finding</text><text x="564" y="606" font-size="11" fill="#8a5a44">findings become an ordered ledger, executed one item at a time</text><text x="564" y="628" font-size="11" fill="#8a5a44">each item commits; the ledger is frozen when the batch ends</text><text x="564" y="650" font-size="11" fill="#8a5a44">finalization is deterministic — same tail commit, composed plan</text><text x="564" y="672" font-size="11" fill="#8a5a44">budgets bound the loop; every revision re-verifies before review</text><path d="M1132 526 L1132 546 L1286 546" stroke="#2f4e7e" stroke-width="1.6" fill="none" marker-end="url(#ab)"/><path d="M700 560 L700 532" stroke="#c4552a" stroke-width="1.6" fill="none" marker-end="url(#ao)"/><rect x="1310" y="244" width="44" height="438" rx="6" fill="#5b7d5b" stroke="none"/><text x="1332" y="463" font-size="14" letter-spacing="3" fill="#f7f5f0" text-anchor="middle" transform="rotate(-90 1332 463)">HUMAN APPROVAL</text><rect x="1390" y="262" width="170" height="50" rx="6" fill="#fbfaf7" stroke="#c9c3b6" stroke-width="1.0"/><text x="1406" y="284" font-size="13.5" fill="#1c2530">Merge locally</text><text x="1406" y="301" font-size="10.5" fill="#8a8578">per your config</text><rect x="1390" y="326" width="170" height="50" rx="6" fill="#fbfaf7" stroke="#c9c3b6" stroke-width="1.0"/><text x="1406" y="348" font-size="13.5" fill="#1c2530">Open a PR</text><text x="1406" y="365" font-size="10.5" fill="#8a8578">evidence attached</text><path d="M1354 287 L1390 287" stroke="#5b7d5b" stroke-width="1.8" fill="none" marker-end="url(#ag)"/><path d="M1354 351 L1390 351" stroke="#5b7d5b" stroke-width="1.8" fill="none" marker-end="url(#ag)"/><text x="1390" y="412" font-size="15" fill="#1c2530" font-weight="600">You decide</text><text x="1390" y="434" font-size="15" fill="#1c2530" font-weight="600">what ships.</text><text x="1390" y="470" font-size="11" fill="#8a8578">Nothing publishes</text><text x="1390" y="486" font-size="11" fill="#8a8578">without this gate.</text><line x1="60" y1="736" x2="1540" y2="736" stroke="#d8d3c8"/><text x="60" y="762" font-size="11.5" fill="#8a8578">Orchestration, worktrees, task state and evidence stay local. Worktree isolation protects your checkout; it is not a security sandbox — tools run with your permissions.</text></svg>
